# Generic kustomize base for the CCC web UI. Cluster-specific values
# (namespace, image pins, ingress) belong in the private ccc-deploy
# repo's overlay, never here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: ccc-web
      app.kubernetes.io/part-of: ccc
